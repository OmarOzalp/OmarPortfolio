<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>Omar Ozalp · OZ BOY</title>
  <meta name="description" content="Omar Ozalp: ECE, CS & Math at Duke. Pick up my OZ BOY handheld and have a look around.">
  <meta name="theme-color" content="#f2d9a8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%226%22 y=%221%22 width=%2220%22 height=%2230%22 rx=%223%22 fill=%22%232a5bd7%22/%3E%3Crect x=%229%22 y=%224%22 width=%2214%22 height=%2211%22 rx=%221%22 fill=%22%23fffaf0%22/%3E%3Cpath d=%22M10 21h6M13 18v6%22 stroke=%22%2314213d%22 stroke-width=%222%22/%3E%3Ccircle cx=%2221%22 cy=%2220%22 r=%221.6%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2218.5%22 cy=%2222.5%22 r=%221.6%22 fill=%22%23fff%22/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OZ BOY">
  <link rel="preload" href="../assets/fonts/press-start-2p-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fonts/vt323-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="ozboy.css">
</head>
<body class="rest">
  <main id="scene">
    <div class="towel" aria-hidden="true"></div>
    <div class="palm" aria-hidden="true"></div>

    <header class="tag">
      <h1>OMAR OZALP</h1>
      <p>ECE · CS · Math @ Duke</p>
    </header>

    <button id="putdown" class="chip" aria-label="Put the handheld down">&#9662;<span> Put down</span></button>
    <button id="mute" class="chip round" aria-label="Mute"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M16 9l6 6M22 9l-6 6"/></svg></button>

    <div id="stage">
      <div id="shadow" aria-hidden="true"></div>
      <div id="holder">
        <div class="slab" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div id="boy" role="application" aria-label="OZ BOY, Omar's handheld. Arrow keys move, Enter opens, Escape goes back.">
          <div class="guts" aria-hidden="true"></div>
          <div class="plastic" aria-hidden="true"></div>
          <div class="switch" aria-hidden="true"><i></i><span>OFF &bull; ON</span></div>
          <div class="bezel">
            <div class="lbl" aria-hidden="true"><i></i>OZ-MATRIX &middot; STEREO SOUND<i></i></div>
            <div class="led" aria-hidden="true"></div><span class="ledlbl" aria-hidden="true">POWER</span>
            <div id="screen" class="off">
              <div id="lcd" aria-live="polite"></div>
              <div class="glass" aria-hidden="true"></div>
            </div>
          </div>
          <div class="logo" aria-hidden="true">OZ BOY <em><b>C</b><b>O</b><b>L</b><b>O</b><b>R</b></em></div>
          <div class="ctl">
            <div class="dpad" data-btn="dpad" aria-label="D-pad"><i></i><i></i><b></b><u></u><u></u><u></u><u></u></div>
            <div class="ab">
              <button class="btn b" data-btn="b" aria-label="B, back"><span>B</span></button>
              <button class="btn a" data-btn="a" aria-label="A, open"><span>A</span></button>
            </div>
            <div class="ss">
              <button data-btn="select" aria-label="Select, options"><span>SELECT</span></button>
              <button data-btn="start" aria-label="Start, home"><span>START</span></button>
            </div>
            <div class="grill" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
          </div>
        </div>
      </div>
    </div>

    <p id="hint" aria-hidden="true"><span>&#9757;</span> Tap it to pick it up</p>

    <nav class="pills" aria-label="Shortcuts">
      <button data-go="resume">Resume</button>
      <button data-go="about">Contact</button>
    </nav>
    <p class="foot"><a href="../plain.html">Plain version</a> &middot; <a href="../?desk">Desk version</a> <span>(best on a laptop)</span></p>
  </main>

  <div id="photo-view" hidden><img alt=""><p></p><button class="chip" aria-label="Close photo">&times; Close</button></div>

  <noscript><p class="noscript">This handheld needs JavaScript. The <a href="../plain.html">plain version</a> doesn't.</p></noscript>

  <script src="../os/sound.js"></script>
  <script src="../os/fs.js"></script>
  <script type="module" src="ozboy.js"></script>
</body>
</html>
