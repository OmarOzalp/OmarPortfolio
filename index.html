<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>Omar Ozalp</title>
  <meta name="description" content="Omar Ozalp: ECE, CS & Math at Duke. Step up to my desk and boot up OzalpOS 98.">
  <meta name="theme-color" content="#0a0c12">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%222%22 y=%222%22 width=%2228%22 height=%2222%22 rx=%223%22 fill=%22%23d9d3c0%22/%3E%3Crect x=%225%22 y=%225%22 width=%2222%22 height=%2216%22 fill=%22%23008080%22/%3E%3Crect x=%2210%22 y=%2226%22 width=%2212%22 height=%224%22 fill=%22%23c4bda6%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="desk/desk.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body data-mode="intro">

  <div id="loader" role="status" aria-live="polite">
    <div class="ld-inner">
      <div class="ld-title">OZ-PC 98</div>
      <div class="ld-bar"><i></i></div>
      <p>Warming up the CRT&hellip;</p>
    </div>
  </div>

  <main id="stage" aria-label="Omar's desk">
    <div id="css"></div>
    <canvas id="gl" aria-hidden="true"></canvas>
  </main>
  <div class="vignette" aria-hidden="true"></div>

  <header id="hud">
    <div class="hud-left">
      <button id="back" hidden>&larr; Back to desk <kbd>Esc</kbd></button>
      <div id="brand">Omar Ozalp<span>ECE &middot; CS &middot; Math @ Duke</span></div>
    </div>
    <div class="hud-right">
      <a id="plain-link" href="plain.html">Plain version</a>
      <button id="mute" aria-label="Mute"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M16 9l6 6M22 9l-6 6"/></svg></button>
    </div>
  </header>

  <nav id="prop-nav" aria-label="Things on the desk"></nav>

  <div id="tooltip" hidden></div>
  <p id="hint" aria-live="polite"></p>

  <aside id="card" hidden aria-live="polite">
    <button class="card-close" aria-label="Put it back">&times;</button>
    <p class="card-kicker"></p>
    <h2 class="card-title"></h2>
    <div class="card-body"></div>
    <div class="card-actions"></div>
  </aside>

  <noscript>
    <p class="noscript">This desk needs JavaScript. The <a href="plain.html">plain version</a> doesn't.</p>
  </noscript>

  <script src="os/sound.js"></script>
  <script src="os/fs.js"></script>
  <script type="module" src="desk/main.js"></script>
</body>
</html>
